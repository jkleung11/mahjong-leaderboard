name: Run Backend Checks

on:
  pull_request:
    branches:
      - main

jobs:
  backend-csharp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend-csharp/Mahjong.Api/Mahjong.Api.csproj

      - name: Build
        run: dotnet build backend-csharp/Mahjong.Api/Mahjong.Api.csproj --no-restore